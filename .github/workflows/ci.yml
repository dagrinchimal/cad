name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System libraries for Qt and Mesa OpenGL
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libgl1-mesa-dri libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0 libxcb-xkb1 libfontconfig1 libdbus-1-3
      - name: Third-party programs that re-read our exports
        run: sudo apt-get install -y librecad qpdf poppler-utils librsvg2-bin hp2xx
      - name: ODA File Converter (for DWG; optional - its download site may change)
        continue-on-error: true
        run: |
          wget -q -O oda.deb "https://www.opendesign.com/guestfiles/get?filename=ODAFileConverter_QT6_lnxX64_8.3dll_27.1.deb" \
            || wget -q -O oda.deb "https://www.opendesign.com/guestfiles/get?filename=ODAFileConverter_QT6_lnxX64_11dll.deb"
          sudo apt-get install -y ./oda.deb libopengl0 libglu1-mesa
          EXE=$(command -v ODAFileConverter || find /usr/bin /opt -name ODAFileConverter -type f 2>/dev/null | head -1)
          echo "ODA: $EXE"
          if [ -n "$EXE" ]; then echo "CAD_ODA_CONVERTER=$EXE" >> "$GITHUB_ENV"; fi
          ldd /usr/bin/ODAFileConverter_*/ODAFileConverter | grep "not found" || echo "all libraries found"
      - run: pip install -e ".[dev]"
      - name: Unit + GUI tests (software renderer, headless)
        run: pytest -m "not perf" -q -rs
      - name: Exports re-read by LibreCAD, ODA, qpdf, poppler, librsvg, hp2xx
        env:
          CAD_REQUIRE_VALIDATORS: "1"
        run: xvfb-run -a pytest tests/validators -v
      - name: GUI tests on the OpenGL renderer (Mesa llvmpipe under Xvfb)
        env:
          QT_QPA_PLATFORM: xcb
          CAD_RENDERER: gl
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1920x1080x24" pytest tests/integration -q
      - name: 50,000-entity performance benchmark
        run: pytest -m perf -s -q
      - name: Screenshot
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          CAD_DATA_DIR: ${{ runner.temp }}/caddata
        run: xvfb-run -a -s "-screen 0 1920x1080x24" python -m cad --screenshot screenshot-linux.png
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-linux
          path: screenshot-linux.png

  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      CAD_RENDERER: painter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ODA File Converter (for the real DWG test; optional)
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.opendesign.com/guestfiles/get?filename=ODAFileConverter_QT6_vc16_amd64dll_27.1.msi" -OutFile oda.msi
          Start-Process msiexec.exe -ArgumentList "/i","oda.msi","/qn","/norestart" -Wait
          Get-ChildItem "C:\Program Files\ODA" -Recurse -Filter ODAFileConverter.exe | Select-Object -First 1 -ExpandProperty FullName
      - run: pip install -e ".[dev]"
      - name: Unit + GUI tests
        run: pytest -m "not perf" -q -rs
      - name: 50,000-entity performance benchmark
        run: pytest -m perf -s -q
      - name: Build CAD.exe (PyInstaller, one folder)
        working-directory: packaging
        run: pyinstaller cad.spec --noconfirm --distpath ../dist --workpath ../build
      - name: Smoke test the built exe (draw, save, reopen)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          CAD_RENDERER: auto
          CAD_DATA_DIR: ${{ runner.temp }}\caddata
        run: |
          $p = Start-Process -FilePath dist\CAD\CAD.exe -ArgumentList "--smoke-test","--report","smoke-report.txt" -Wait -PassThru
          Get-Content smoke-report.txt
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }
      - name: Screenshot from the built exe
        shell: pwsh
        env:
          QT_QPA_PLATFORM: windows
          CAD_RENDERER: auto
          CAD_DATA_DIR: ${{ runner.temp }}\caddata
        run: |
          $p = Start-Process -FilePath dist\CAD\CAD.exe -ArgumentList "--screenshot","screenshot-windows.png" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Screenshot failed" }
      - name: Portable zip
        shell: pwsh
        run: |
          New-Item dist\CAD\portable.flag -ItemType File | Out-Null
          Compress-Archive -Path dist\CAD -DestinationPath CAD-Portable-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CAD-Portable-windows
          path: CAD-Portable-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: screenshot-windows
          path: |
            screenshot-windows.png
            smoke-report.txt
